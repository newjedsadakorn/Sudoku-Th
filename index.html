<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ซูโดกุ 1000 แบบฝึก</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f7fc" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ซูโดกุ">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f7fc; --white:#ffffff; --ink:#16212f; --soft:#78899d;
  --hair:#d3e2ef; --rule:#7ba3c8; --edge:#e2ecf6; --tint:#eaf3fb;
  --peer:#f0f7fd; --twin:#d7e9f8; --sel:#b9dcf7;
  --blue:#2e7fc4; --bad:#c9556c; --bad-bg:#fbeaed;
}
[data-night="1"]{
  --bg:#0f1621; --white:#18202c; --ink:#e6eef7; --soft:#8296ab;
  --hair:#26313f; --rule:#456079; --edge:#222c39; --tint:#1d2836;
  --peer:#1b2532; --twin:#254257; --sel:#2f5b80;
  --blue:#5aa9e6; --bad:#e0748a; --bad-bg:#3a2029;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overscroll-behavior:none}
body{
  height:100dvh; overflow:hidden;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif;
  font-weight:400; display:flex; justify-content:center;
  padding:10px 10px calc(8px + env(safe-area-inset-bottom));
  transition:background-color .2s ease, color .2s ease;
}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column}
#app > section{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#vHome,#vPick,#vStats,#vSet{overflow-y:auto;-webkit-overflow-scrolling:touch}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.hide{display:none !important}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.card{background:var(--white);border:1px solid var(--edge);border-radius:14px}

/* ── หัวหน้าแรก ── */
.head{padding:12px 2px 2px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex:none}
.head h1{font-size:25px;font-weight:500;letter-spacing:-.015em;line-height:1.15}
.head p{font-size:12.5px;font-weight:300;color:var(--soft);margin-top:4px}
.headbtns{display:flex;gap:6px;flex:none}
.ibtn{width:36px;height:36px;border-radius:11px;background:var(--white);border:1px solid var(--edge);
  display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px;stroke:var(--soft);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}

/* ── การ์ดเล่นต่อ / โจทย์ประจำวัน ── */
.banner{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;
  padding:13px 15px;text-align:left;flex:none;
  background:var(--white);border:1px solid var(--edge);border-radius:14px;
}
.banner.accent{background:var(--blue);border-color:var(--blue);color:#fff}
.banner.accent .b-sub{color:rgba(255,255,255,.8)}
.banner.accent .dot{background:rgba(255,255,255,.25)}
.banner:active{transform:scale(.99)}
.dot{width:34px;height:34px;border-radius:11px;background:var(--tint);display:grid;place-items:center;flex:none}
.dot svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.b-name{font-size:14.5px;font-weight:500;display:block;line-height:1.35}
.b-sub{font-size:12px;font-weight:300;color:var(--soft);display:block;margin-top:1px}
.b-go{font-size:18px;opacity:.5;flex:none}

/* ── รายการระดับ ── */
.tiers{display:flex;flex-direction:column;gap:8px;flex:none}
.tier{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;
  padding:14px 15px;text-align:left;
  background:var(--white);border:1px solid var(--edge);border-radius:14px}
.tier:not(.locked):active{transform:scale(.99)}
.tier.locked{background:transparent;border-style:dashed;cursor:default}
.tier.locked .tier-name,.tier.locked .tier-sub{color:var(--soft)}
.steps{display:flex;align-items:flex-end;gap:3px;height:20px}
.step{width:4px;border-radius:1px;background:var(--hair)}
.step.on{background:var(--blue)}
.tier.locked .step.on{background:var(--hair)}
.tier-name{font-size:15.5px;font-weight:500;display:block;line-height:1.35}
.tier-sub{font-size:12px;font-weight:300;color:var(--soft);display:block;margin-top:1px}
.tier-right{text-align:right;font-size:11.5px;color:var(--soft);line-height:1.5;flex:none}
.tier-right b{display:block;font-size:16px;font-weight:500;color:var(--ink);font-family:'IBM Plex Mono',monospace}
#homeNote{margin-top:auto}        /* ดันหมายเหตุลงไปติดขอบล่าง ช่องว่างจะได้รวมเป็นก้อนเดียว */
.note{font-size:11.5px;font-weight:300;color:var(--soft);text-align:center;line-height:1.8;padding:2px 8px;flex:none}

/* ── แถบบน ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.topleft{display:flex;align-items:center;gap:11px;min-width:0}
.back{width:34px;height:34px;border-radius:10px;flex:none;background:var(--white);
  border:1px solid var(--edge);display:grid;place-items:center;font-size:17px;color:var(--soft)}
.back:active{transform:scale(.94)}
.top-h{font-size:15px;font-weight:500;line-height:1.3}
.top-s{font-size:11px;font-weight:300;color:var(--soft)}

/* ── เลือกข้อ ── */
.pick-body{padding:15px;flex:none;margin:auto 0;display:flex;flex-direction:column}
.pick-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex:none}
.pick-head h2{font-size:13px;font-weight:400;color:var(--soft)}
.pager{display:flex;align-items:center;gap:2px}
.pager button{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;color:var(--blue);font-size:15px}
.pager button:disabled{color:var(--hair)}
.pager span{font-size:12px;color:var(--soft);min-width:34px;text-align:center}
#nums{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:7px;flex:none}
.num{aspect-ratio:1;border-radius:10px;background:var(--tint);border:1px solid transparent;
  font-family:'IBM Plex Mono',monospace;font-size:14px;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.num:active{transform:scale(.94)}
.num small{font-size:9px;color:var(--blue);font-family:'IBM Plex Mono',monospace}
.num.done{background:var(--white);border-color:var(--blue);color:var(--blue)}
.num.next{background:var(--blue);color:#fff;font-weight:500}
.num.lk{background:transparent;border:1px dashed var(--hair);color:var(--soft);opacity:.4}
.acts{display:flex;gap:8px;margin-top:14px;flex:none}
.btn{flex:1;padding:12px;border-radius:11px;font-size:14px;background:var(--blue);color:#fff}
.btn.alt{background:var(--tint);color:var(--ink)}
.btn:active{transform:scale(.98)}

/* ── กระดาน ── */
.clock{display:flex;align-items:center;gap:8px;flex:none}
#time{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#pauseB{width:34px;height:34px;border-radius:10px;background:var(--white);border:1px solid var(--edge);
  display:grid;place-items:center;font-size:11px;color:var(--soft)}
#lives{font-size:11.5px;color:var(--bad);font-weight:400}
#chal{display:flex;gap:6px;flex:none;justify-content:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:300;background:var(--white);border:1px solid var(--edge);color:var(--soft)}
.chip.ok{border-color:var(--blue);color:var(--blue)}
.chip.no{opacity:.42;text-decoration:line-through}
#boardWrap{flex:1;min-height:0;display:grid;place-items:center}
#board{display:grid;aspect-ratio:1;
  grid-template-columns:repeat(9, minmax(0, 1fr));
  grid-template-rows:repeat(9, minmax(0, 1fr));
  border:2px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--white)}
.cell{position:relative;display:grid;place-items:center;cursor:pointer;
  min-width:0;min-height:0;overflow:hidden;
  font-family:'IBM Plex Mono',monospace;font-size:calc(var(--cell,34px) * .56);
  font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);
  border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  transition:background-color .08s linear}
.cell.c8{border-right:0}
.cell.r8{border-bottom:0}
.cell.c2,.cell.c5{border-right:2px solid var(--rule)}
.cell.r2,.cell.r5{border-bottom:2px solid var(--rule)}
.cell.peer{background:var(--peer)}
.cell.twin{background:var(--twin)}
.cell.sel{background:var(--sel)}
.cell.given{font-weight:500}
.cell.user{color:var(--blue)}
.cell.bad{color:var(--bad);background:var(--bad-bg)}
.cell.flash{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}
.notes{position:absolute;inset:1px;display:grid;
  grid-template:repeat(3, minmax(0,1fr)) / repeat(3, minmax(0,1fr));
  font-size:calc(var(--cell,34px) * .27);color:var(--soft)}
.notes b{display:grid;place-items:center;font-weight:400}

/* ── แผงตัวเลข + เครื่องมือ ── */
#pad{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:6px;flex:none}
.key{position:relative;min-width:0;background:var(--white);border:1px solid var(--edge);border-radius:12px;
  height:clamp(54px, 8.2dvh, 82px);display:grid;place-items:center}
.key:active{transform:scale(.93)}
.key b{font-family:'IBM Plex Mono',monospace;font-size:clamp(23px,4dvh,32px);font-weight:500;line-height:1;color:var(--blue)}
.key i{position:absolute;right:10px;bottom:6px;font-style:normal;font-size:11px;color:var(--soft);
  font-family:'IBM Plex Mono',monospace}
.key.spent{background:var(--bg);border-color:transparent}
.key.spent b{color:var(--hair)}
.key.spent i{visibility:hidden}
#tools{display:grid;grid-template-columns:repeat(6, minmax(0,1fr));gap:5px;flex:none}
.tool{position:relative;min-width:0;overflow:hidden;background:var(--white);border:1px solid var(--edge);border-radius:11px;
  height:clamp(46px, 6.4dvh, 62px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:9.5px;font-weight:300;color:var(--soft)}
.tool svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:active{transform:scale(.95)}
.tool.on{background:var(--blue);border-color:var(--blue)}
.tool.on svg{stroke:#fff}
.tool.on span{color:#fff}
.tool:disabled{opacity:.35}
.bdg{position:absolute;top:4px;right:8px;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;font-weight:500;color:var(--blue);line-height:1;font-style:normal}
.tool:disabled .bdg{color:var(--soft)}

/* ── สถิติ ── */
.statgrid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px;flex:none}
.stat{background:var(--white);border:1px solid var(--edge);border-radius:13px;padding:13px 10px;text-align:center}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:500;line-height:1.2}
.stat span{display:block;font-size:10.5px;font-weight:300;color:var(--soft);margin-top:3px}
.trow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;
  padding:11px 14px;border-bottom:1px solid var(--edge);font-size:13px}
.trow:last-child{border-bottom:0}
.trow.hdr{font-size:10.5px;font-weight:300;color:var(--soft);padding:9px 14px}
.trow.plain{grid-template-columns:1fr auto}
.trow em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:12.5px;min-width:52px;text-align:right}

/* ── ตั้งค่า ── */
.srow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  padding:13px 15px;border-bottom:1px solid var(--edge);text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.srow b{font-size:14px;font-weight:400;display:block}
.srow span{font-size:11.5px;font-weight:300;color:var(--soft);display:block;margin-top:2px;line-height:1.5}
.sw{width:44px;height:26px;border-radius:13px;background:var(--hair);position:relative;flex:none;transition:background .15s ease}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(18px)}
.danger{color:var(--bad)}

/* ── เลเยอร์ทับ ── */
.veil{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:28px;text-align:center;
  background:color-mix(in srgb, var(--bg) 93%, transparent);backdrop-filter:blur(8px)}
.veil h2{font-size:22px;font-weight:500}
.veil p{font-size:13.5px;font-weight:300;color:var(--soft);max-width:31ch;line-height:1.8}
.bigtime{font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:500;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.tagline{font-size:13px;color:var(--blue)}
.rewards{font-size:12.5px;font-weight:300;color:var(--soft);line-height:1.9;max-width:33ch}
.rewards b{color:var(--blue);font-weight:500}
.veil .acts{width:100%;max-width:290px}
.spin{width:30px;height:30px;border:2px solid var(--hair);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* จอเตี้ย (iPhone SE และรุ่นเล็ก) บีบส่วนประกอบรอบข้างเพื่อคืนพื้นที่ให้กระดาน */
@media (max-height: 720px){
  #app > section{gap:9px}
  #chal{gap:4px}
  .chip{padding:3px 8px;font-size:10px}
  .key{height:clamp(50px, 8.2dvh, 82px)}
  .tool{height:clamp(43px, 6.4dvh, 62px);font-size:9px}
  .head{padding:8px 2px 0}
  .head h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app">

<!-- ═══════ หน้าแรก ═══════ -->
<section id="vHome">
  <div class="head">
    <div>
      <h1>ซูโดกุ</h1>
      <p>1000 แบบฝึก · ห้าระดับ</p>
    </div>
    <div class="headbtns">
      <button class="ibtn" id="bStats" aria-label="สถิติ">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button class="ibtn" id="bSet" aria-label="ตั้งค่า">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4 13.9H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg></button>
    </div>
  </div>

  <button class="banner accent hide" id="bResumeCard">
    <span class="dot"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg></span>
    <span><span class="b-name" id="rcName">เล่นต่อ</span><span class="b-sub" id="rcSub"></span></span>
    <span class="b-go">›</span>
  </button>

  <button class="banner" id="bDailyCard">
    <span class="dot"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
    <span><span class="b-name" id="dcName">โจทย์ประจำวัน</span><span class="b-sub" id="dcSub"></span></span>
    <span class="b-go">›</span>
  </button>

  <div class="tiers" id="tiers"></div>
  <p class="note" id="homeNote"></p>
</section>

<!-- ═══════ เลือกข้อ ═══════ -->
<section id="vPick" class="hide">
  <div class="topbar">
    <div class="topleft">
      <button class="back" id="pickBack" aria-label="ย้อนกลับ">‹</button>
      <div><div class="top-h" id="pickName">ปานกลาง</div><div class="top-s" id="pickSub"></div></div>
    </div>
  </div>
  <div class="card pick-body">
    <div class="pick-head">
      <h2 id="rangeLbl">ข้อ 1–25</h2>
      <div class="pager">
        <button id="pgPrev" aria-label="หน้าก่อน">‹</button>
        <span id="pgLbl" class="mono">1 / 8</span>
        <button id="pgNext" aria-label="หน้าถัดไป">›</button>
      </div>
    </div>
    <div id="nums"></div>
    <div class="acts">
      <button class="btn" id="bContinue">เล่นข้อถัดไป</button>
    </div>
  </div>
  <p class="note" id="pickNote"></p>
</section>

<!-- ═══════ สถิติ ═══════ -->
<section id="vStats" class="hide">
  <div class="topbar">
    <div class="topleft">
      <button class="back" id="statsBack" aria-label="ย้อนกลับ">‹</button>
      <div><div class="top-h">สถิติ</div><div class="top-s" id="statsSub"></div></div>
    </div>
  </div>
  <div class="statgrid" id="statTop"></div>
  <div class="card" id="statTable"></div>
  <p class="note">เวลาที่บันทึกคือเวลาที่ดีที่สุดของแต่ละข้อ</p>
</section>

<!-- ═══════ ตั้งค่า ═══════ -->
<section id="vSet" class="hide">
  <div class="topbar">
    <div class="topleft">
      <button class="back" id="setBack" aria-label="ย้อนกลับ">‹</button>
      <div><div class="top-h">ตั้งค่า</div></div>
    </div>
  </div>
  <div class="card">
    <button class="srow" id="swNight"><span><b>โหมดกลางคืน</b><span>พื้นหลังเข้ม สบายตาเวลาเล่นก่อนนอน</span></span><span class="sw"></span></button>
    <button class="srow" id="swSound"><span><b>เสียง</b><span>เสียงสั้นตอนลงเลข ลงผิด และเล่นจบ</span></span><span class="sw"></span></button>
    <button class="srow" id="swCheck"><span><b>ตรวจผิดทันที</b><span>ปิดไว้ถ้าอยากหาที่ผิดเอง เลขผิดจะไม่ขึ้นสีแดง</span></span><span class="sw"></span></button>
    <button class="srow" id="swStrict"><span><b>โหมดเข้มงวด</b><span>ลงผิดเกินเป้าภารกิจของระดับนั้นถือว่าแพ้ ต้องเริ่มข้อใหม่</span></span><span class="sw"></span></button>
  </div>
  <div class="card">

<script>
(() => {
'use strict';



/* ==================================================================
   1. เครื่องสุ่มแบบมี seed — ข้อเดิมต้องได้โจทย์เดิมเสมอ
   ================================================================== */
function mulberry(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rand){
  for(let i = arr.length - 1; i > 0; i--){
    const j = (rand() * (i + 1)) | 0;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ==================================================================
   2. โครงสร้างหน่วย (แถว / หลัก / บล็อก) เตรียมไว้ล่วงหน้า
   ================================================================== */
const ROW = [], COL = [], BOX = [], UNITS = [], PEERS = [];
for(let i = 0; i < 9; i++){ ROW.push([]); COL.push([]); BOX.push([]); }
for(let i = 0; i < 81; i++){
  const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
  ROW[r].push(i); COL[c].push(i); BOX[b].push(i);
}
UNITS.push(...ROW, ...COL, ...BOX);
for(let i = 0; i < 81; i++){
  const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
  const s = new Set([...ROW[r], ...COL[c], ...BOX[b]]);
  s.delete(i);
  PEERS.push([...s]);
}
const BIT = [0, 1, 2, 4, 8, 16, 32, 64, 128, 256];
const popcount = m => { let n = 0; while(m){ m &= m - 1; n++; } return n; };
const lowbit = m => Math.log2(m & -m) + 1;

/* ==================================================================
   3. ตัวช่วยพื้นฐาน
   ================================================================== */
function allows(g, i, v){
  for(const p of PEERS[i]) if(g[p] === v) return false;
  return true;
}
function fullGrid(rand){
  const g = new Uint8Array(81);
  (function fill(i){
    if(i === 81) return true;
    for(const v of shuffle([1,2,3,4,5,6,7,8,9], rand)){
      if(allows(g, i, v)){
        g[i] = v;
        if(fill(i + 1)) return true;
        g[i] = 0;
      }
    }
    return false;
  })(0);
  return g;
}
/* นับจำนวนคำตอบ หยุดเมื่อถึง limit (ใช้เช็คว่าโจทย์มีคำตอบเดียว) */
function countSolutions(src, limit){
  const g = Uint8Array.from(src);
  let found = 0;
  (function go(){
    let cell = -1, best = 10, bestMask = 0;
    for(let i = 0; i < 81; i++){
      if(g[i]) continue;
      let mask = 0x1FF;
      for(const p of PEERS[i]) if(g[p]) mask &= ~BIT[g[p]];
      const n = popcount(mask);
      if(n < best){ best = n; cell = i; bestMask = mask; if(n < 2) break; }
    }
    if(cell < 0){ found++; return; }
    if(best === 0) return;
    for(let v = 1; v <= 9; v++){
      if(bestMask & BIT[v]){
        g[cell] = v; go(); g[cell] = 0;
        if(found >= limit) return;
      }
    }
  })();
  return found;
}

/* ==================================================================
   4. ตัวแก้แบบ "คิดตามหลัก" — ใช้วัดว่าโจทย์ยากระดับไหนจริงๆ
      ระดับ 0 naked single      · เห็นช่องที่ลงได้เลขเดียว
      ระดับ 1 hidden single     · เลขนั้นลงได้ที่เดียวในแถว/หลัก/บล็อก
      ระดับ 2 locked candidates · ตัดตัวเลือกข้ามบล็อกกับแถว
      ระดับ 3 naked pair/triple · จับคู่-จับสามช่อง
      ระดับ 4 x-wing            · ตัดตัวเลือกแบบสี่เหลี่ยม
      ระดับ 5 = เทคนิคข้างบนไม่พอ ต้องเดา
   ================================================================== */
function buildCands(g){
  const cand = new Int16Array(81);
  for(let i = 0; i < 81; i++){
    if(g[i]){ cand[i] = 0; continue; }
    let m = 0x1FF;
    for(const p of PEERS[i]) if(g[p]) m &= ~BIT[g[p]];
    cand[i] = m;
  }
  return cand;
}
function place(g, cand, i, v){
  g[i] = v; cand[i] = 0;
  for(const p of PEERS[i]) cand[p] &= ~BIT[v];
}

function logicRate(puzzle, maxLevel){
  const g = Uint8Array.from(puzzle);
  let cand = buildCands(g);
  let hardest = -1, empty = 0;
  for(let i = 0; i < 81; i++) if(!g[i]) empty++;

  while(empty > 0){
    let moved = false;

    // --- ระดับ 0: naked single ---
    for(let i = 0; i < 81 && !moved; i++){
      if(!g[i] && popcount(cand[i]) === 1){
        place(g, cand, i, lowbit(cand[i])); empty--; moved = true;
        hardest = Math.max(hardest, 0);
      }
      if(!g[i] && cand[i] === 0) return {level: 9, solved: false};
    }
    if(moved) continue;
    if(maxLevel < 1) break;

    // --- ระดับ 1: hidden single ---
    for(const u of UNITS){
      for(let v = 1; v <= 9 && !moved; v++){
        let spot = -1, n = 0;
        for(const i of u){
          if(g[i] === v){ n = 0; break; }
          if(!g[i] && (cand[i] & BIT[v])){ spot = i; n++; }
        }
        if(n === 1){
          place(g, cand, spot, v); empty--; moved = true;
          hardest = Math.max(hardest, 1);
        }
      }
      if(moved) break;
    }
    if(moved) continue;
    if(maxLevel < 2) break;

    // --- ระดับ 2: locked candidates ---
    for(let b = 0; b < 9 && !moved; b++){
      for(let v = 1; v <= 9; v++){
        const spots = BOX[b].filter(i => !g[i] && (cand[i] & BIT[v]));
        if(spots.length < 2) continue;
        const rows = new Set(spots.map(i => (i / 9) | 0));
        const cols = new Set(spots.map(i => i % 9));
        const strip = (line) => {
          let cut = false;
          for(const i of line){
            if(!spots.includes(i) && !g[i] && (cand[i] & BIT[v])){ cand[i] &= ~BIT[v]; cut = true; }
          }
          return cut;
        };
        if(rows.size === 1 && strip(ROW[[...rows][0]])) moved = true;
        if(cols.size === 1 && strip(COL[[...cols][0]])) moved = true;
        if(moved){ hardest = Math.max(hardest, 2); break; }
      }
    }
    if(moved) continue;
    for(const line of [...ROW, ...COL]){
      for(let v = 1; v <= 9 && !moved; v++){
        const spots = line.filter(i => !g[i] && (cand[i] & BIT[v]));
        if(spots.length < 2) continue;
        const boxes = new Set(spots.map(i => (((i / 9) | 0) / 3 | 0) * 3 + ((i % 9) / 3 | 0)));
        if(boxes.size !== 1) continue;
        for(const i of BOX[[...boxes][0]]){
          if(!spots.includes(i) && !g[i] && (cand[i] & BIT[v])){ cand[i] &= ~BIT[v]; moved = true; }
        }
        if(moved) hardest = Math.max(hardest, 2);
      }
      if(moved) break;
    }
    if(moved) continue;
    if(maxLevel < 3) break;

    // --- ระดับ 3: naked pair / triple ---
    for(const u of UNITS){
      const open = u.filter(i => !g[i]);
      for(let size = 2; size <= 3 && !moved; size++){
        const combos = (arr, k, start = 0, cur = []) => {
          if(cur.length === k) return [cur.slice()];
          const out = [];
          for(let x = start; x < arr.length; x++){ cur.push(arr[x]); out.push(...combos(arr, k, x + 1, cur)); cur.pop(); }
          return out;
        };
        for(const set of combos(open, size)){
          let mask = 0;
          for(const i of set) mask |= cand[i];
          if(popcount(mask) !== size) continue;
          for(const i of open){
            if(set.includes(i)) continue;
            if(cand[i] & mask){ cand[i] &= ~mask; moved = true; }
          }
          if(moved){ hardest = Math.max(hardest, 3); break; }
        }
      }
      if(moved) break;
    }
    if(moved) continue;
    if(maxLevel < 4) break;

    // --- ระดับ 4: x-wing ---
    for(let v = 1; v <= 9 && !moved; v++){
      for(const [lines, other] of [[ROW, COL], [COL, ROW]]){
        const pos = lines.map(line => line.filter(i => !g[i] && (cand[i] & BIT[v])));
        for(let a = 0; a < 9 && !moved; a++){
          if(pos[a].length !== 2) continue;
          const ka = pos[a].map(i => lines === ROW ? i % 9 : (i / 9) | 0);
          for(let b2 = a + 1; b2 < 9 && !moved; b2++){
            if(pos[b2].length !== 2) continue;
            const kb = pos[b2].map(i => lines === ROW ? i % 9 : (i / 9) | 0);
            if(ka[0] !== kb[0] || ka[1] !== kb[1]) continue;
            for(const k of ka){
              for(const i of other[k]){
                const idx = lines === ROW ? (i / 9) | 0 : i % 9;
                if(idx === a || idx === b2) continue;
                if(!g[i] && (cand[i] & BIT[v])){ cand[i] &= ~BIT[v]; moved = true; }
              }
            }
            if(moved) hardest = Math.max(hardest, 4);
          }
        }
      }
    }
    if(!moved) break;
  }
  return {level: empty === 0 ? Math.max(hardest, 0) : 5, solved: empty === 0};
}

/* ==================================================================
   5. ระดับความยาก 5 ชั้น
   ================================================================== */
const TIERS = [
  {key:'rookie', name:'มือใหม่',  sub:'เริ่ม 40 ช่อง · เห็นคำตอบตรงๆ',    maxTech:0, minTech:0, minGivens:40, sym:true},
  {key:'easy',   name:'ง่าย',     sub:'เริ่ม 32 ช่อง · ไล่ดูทีละหน่วย',   maxTech:1, minTech:1, minGivens:32, sym:true},
  {key:'medium', name:'ปานกลาง',  sub:'เริ่ม 26 ช่อง · ตัดตัวเลือกข้ามบล็อก', maxTech:2, minTech:2, minGivens:26, sym:false},
  {key:'hard',   name:'ยาก',      sub:'เริ่ม 24 ช่อง · จับคู่ตัวเลือกเป็นชุด', maxTech:3, minTech:3, minGivens:23, sym:false},
  {key:'master', name:'มาสเตอร์', sub:'เทคนิคลึก บางข้อต้องลองผิดลองถูก', maxTech:5, minTech:4, minGivens:22, sym:false}
];

/* ==================================================================
   6. สร้างโจทย์จากหมายเลขข้อ (deterministic)
      ข้อเดิม + ระดับเดิม = โจทย์เดิมเป๊ะ ทุกเครื่อง ทุกครั้ง
   ================================================================== */
function generate(tierIdx, num){
  const tier = TIERS[tierIdx];
  let best = null;

  for(let attempt = 0; attempt < 14; attempt++){
    const seed = (tierIdx * 7919 + num * 104729 + attempt * 15485863) >>> 0;
    const rand = mulberry(seed);
    const sol = fullGrid(rand);
    const puz = Uint8Array.from(sol);

    const order = shuffle([...Array(81).keys()], rand);
    for(const i of order){
      if(!puz[i]) continue;
      const pair = tier.sym ? 80 - i : i;
      const saved = [puz[i], puz[pair]];
      puz[i] = 0; puz[pair] = 0;

      let givens = 0;
      for(let k = 0; k < 81; k++) if(puz[k]) givens++;

      let keep = givens >= tier.minGivens && countSolutions(puz, 2) === 1;
      if(keep && tier.maxTech < 5) keep = logicRate(puz, tier.maxTech).solved;
      if(!keep){ puz[i] = saved[0]; puz[pair] = saved[1]; }
    }

    const rating = logicRate(puz, 4);
    const level = rating.solved ? rating.level : 5;
    let givens = 0;
    for(let k = 0; k < 81; k++) if(puz[k]) givens++;

    if(!best || level > best.level) best = {puz, sol, level, givens};
    if(level >= tier.minTech && level <= tier.maxTech) return {puzzle: puz, solution: sol, level, givens};
  }
  return {puzzle: best.puz, solution: best.sol, level: best.level, givens: best.givens};
}





/* ==================================================================
   7. โครงหลักสูตร
   ================================================================== */
const PER_TIER = 200, PER_PAGE = 25;
const PAGES = Math.ceil(PER_TIER / PER_PAGE);
const UNLOCK = 10;
/* ภารกิจของแต่ละข้อ: เวลาเป้าหมาย (วินาที) และจำนวนครั้งที่ลงผิดได้
   ทำสำเร็จข้อละ +1 ตัวช่วย และครบทุก 5 ข้อในระดับนั้นได้โบนัสอีก +2 */
const CHAL = [
  {sec:  360, miss: 1},   // มือใหม่    6 นาที
  {sec:  540, miss: 2},   // ง่าย       9 นาที
  {sec:  840, miss: 3},   // ปานกลาง   14 นาที
  {sec: 1320, miss: 4},   // ยาก       22 นาที
  {sec: 2100, miss: 5}    // มาสเตอร์  35 นาที
];
const MILESTONE = 5, MILESTONE_REWARD = 2, START_ITEMS = 3, MAX_ITEMS = 9;
/* โหมดเข้มงวด: ลงผิดเกินเป้าภารกิจของระดับนั้นเมื่อไหร่ถือว่าแพ้
   ผูกกับ CHAL เพื่อไม่ให้ขัดกับตัวเลขที่แสดงบนแถบภารกิจ */
const strictCap = t => CHAL[t].miss + 1;
const TECH = ['เห็นช่องเดียวตรงๆ' ,'เลขลงได้ที่เดียวในหน่วย','ตัดตัวเลือกข้ามบล็อก',
              'จับคู่ตัวเลือกเป็นชุด','ตัดแบบสี่เหลี่ยม','ต้องลองผิดลองถูก'];

/* ==================================================================
   8. ข้อมูลที่บันทึก
   ================================================================== */
const KEY = 'sudoku1000v3';
const save = {
  best: {},            // 'medium:17' → เวลาที่ดีที่สุด (ms)
  daily: {},           // '2026-09-13' → เวลาที่ทำได้
  days: [],            // วันที่ที่เล่นจบอย่างน้อยหนึ่งข้อ
  hintsTotal: 0, items: START_ITEMS, topUp: null,
  wip: null,           // เกมที่เล่นค้างไว้
  night: 0, sound: 1, check: 1, strict: 0
};
const storage = {
  async load(){
    try{
      const r = await window.storage.get(KEY);
      if(r && r.value){ Object.assign(save, JSON.parse(r.value)); return; }
    }catch(e){}
    try{
      const raw = window.localStorage.getItem(KEY);
      if(raw) Object.assign(save, JSON.parse(raw));
    }catch(e){}
  },
  async put(){
    const json = JSON.stringify(save);
    let ok = false;
    try{ await window.storage.set(KEY, json); ok = true; }catch(e){}
    if(!ok){ try{ window.localStorage.setItem(KEY, json); }catch(e){} }
  }
};
const bestKey = (t, n) => TIERS[t].key + ':' + n;
const doneCount = t => Object.keys(save.best).filter(k => k.startsWith(TIERS[t].key + ':')).length;
const isOpen = t => t === 0 || doneCount(t - 1) >= UNLOCK;
/* ข้อ n เล่นได้ก็ต่อเมื่อผ่านข้อ n-1 มาแล้ว ข้อ 1 เปิดเสมอ */
const puzzleOpen = (t, n) => n === 1 || save.best[bestKey(t, n - 1)] !== undefined;
const topOpen = () => { let t = 0; while(t < 4 && isOpen(t + 1)) t++; return t; };

/* ==================================================================
   9. เสียง (สร้างจาก Web Audio ไม่ต้องใช้ไฟล์)
   ================================================================== */
let actx = null;
function tone(freq, dur, type, vol){
  if(!save.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
const sfx = {
  place: () => tone(720, .07, 'sine', .05),
  note:  () => tone(480, .05, 'sine', .035),
  erase: () => tone(300, .06, 'sine', .04),
  wrong: () => tone(150, .25, 'square', .045),
  hint:  () => tone(880, .10, 'triangle', .04),
  win:   () => [0, 140, 280, 460].forEach((d, i) =>
           setTimeout(() => tone([523, 659, 784, 1046][i], .3, 'sine', .05), d)),
  lose:  () => [0, 160].forEach((d, i) =>
           setTimeout(() => tone([300, 200][i], .35, 'sawtooth', .04), d))
};

/* ==================================================================
   10. วันที่ / โจทย์ประจำวัน
   ================================================================== */
function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayNumber(key){
  const [y, m, d] = key.split('-').map(Number);
  return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
}
/* ระดับหมุนตามวันในสัปดาห์ อาทิตย์ง่ายสุด เสาร์ยากสุด */
const DAILY_TIER = [1, 1, 2, 2, 2, 3, 4];
function dailyInfo(key){
  key = key || dayKey();
  const wd = new Date(key + 'T00:00:00').getDay();
  return {key, tier: DAILY_TIER[wd], num: 10000 + dayNumber(key)};
}

      wake = await navigator.wakeLock.request('screen');

           : `${m}:${String(sec).padStart(2,'0')}`;
}

function streak(){
  const set = new Set(save.days || []);
  let cur = 0;
  const d = new Date();
  if(!set.has(dayKey(d))) d.setDate(d.getDate() - 1);   // ยังไม่เล่นวันนี้ก็นับจากเมื่อวาน
  while(set.has(dayKey(d))){ cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  [...set].sort().forEach(k => {
    run = (prev !== null && dayNumber(k) - dayNumber(prev) === 1) ? run + 1 : 1;
    prev = k; if(run > best) best = run;
  });
  return {cur, best};
}
function drawStats(){
  const times = Object.values(save.best);

    <div class="stat"><b>${save.items}</b><span>ตัวช่วยที่มี</span></div>`;

    const n = list.length;

  html += `<div class="trow plain"><span>ใช้ตัวช่วยรวม</span><em>${save.hintsTotal} ครั้ง</em></div>`;
  $('statTable').innerHTML = html;
}

let wipTimer = null;
function stashWip(now){
  if(!G || G.done) return;
  const doIt = () => {
    if(!G || G.done) return;
    save.wip = {
      t: G.tier, n: G.num, daily: G.daily,

      nt: Array.from(G.notes).join(','),
      ms: Math.round(G.elapsed), h: G.hints, m: G.mistakes
    };

  };

  if(now) doIt(); else wipTimer = setTimeout(doIt, 700);
}
function clearWip(){

}

/* ==================================================================
   16. กระดาน
   ================================================================== */
function fitBoard(){
  const wrap = $('boardWrap'), b = $('board');
  if(!wrap || !b || !wrap.clientHeight) return;
  const side = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight));
  const size = Math.max(200, side - (side % 9));
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.style.setProperty('--cell', (size / 9) + 'px');
}
let fitTimer = null;
const fitSoon = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitBoard, 60); };
window.addEventListener('resize', fitSoon);
window.addEventListener('orientationchange', fitSoon);

const cells = [];
function buildBoard(){
  if(cells.length === 81) return;
  const board = $('board');
  for(let i = 0; i < 81; i++){
    const d = document.createElement('div');
    d.className = `cell r${(i/9)|0} c${i%9}`;
    d.setAttribute('role', 'gridcell');
    d.onclick = () => { G.sel = i; render(); };
    board.appendChild(d);
    cells.push(d);
  }
}
function render(){
  if(!G) return;
  const sel = G.sel;
  const selVal = sel >= 0 ? G.board[sel] : 0;
  const peerSet = sel >= 0 ? new Set(PEERS[sel]) : null;

  for(let i = 0; i < 81; i++){
    const el = cells[i], v = G.board[i];
    const given = G.puzzle[i] !== 0;
    let cls = `cell r${(i/9)|0} c${i%9}`;
    if(peerSet && peerSet.has(i)) cls += ' peer';
    if(selVal && v === selVal && i !== sel) cls += ' twin';
    if(i === sel) cls += ' sel';
    if(v){
      cls += given ? ' given' : ' user';
      if(!given && save.check && v !== G.solution[i]) cls += ' bad';
    }
    el.className = cls;
    if(v) el.textContent = v;
    else if(G.notes[i]){
      let h = '<div class="notes">';
      for(let d = 1; d <= 9; d++) h += `<b>${G.notes[i] & BIT[d] ? d : ''}</b>`;
      el.innerHTML = h + '</div>';
    }
    else el.textContent = '';
  }
  for(let d = 1; d <= 9; d++){
    const used = countPlaced(d);
    const k = $('key' + d);
    k.classList.toggle('spent', used >= 9);
    k.disabled = used >= 9;
    k.querySelector('i').textContent = 9 - used;
  }
  $('tNote').classList.toggle('on', G.noteMode);
  $('tFill').disabled = G.tier < FILL_MIN_TIER;
  $('tUndo').disabled = !G.undoStack.length;
  $('tRedo').disabled = !G.redoStack.length;
  $('tHint').disabled = save.items <= 0;
  $('hintBdg').textContent = save.items;
  updateChal();
  if(save.strict) $('lives').textContent = `ผิด ${G.mistakes}/${CHAL[G.tier].miss}`;
}

/* ---------- แถบภารกิจ ---------- */
const chipHTML = (ok, txt) => `<span class="chip ${ok ? 'ok' : 'no'}">${ok ? '◆' : '◇'} ${txt}</span>`;
function updateChal(){
  const el = $('chal');
  if(!G || !G.firstClear){ el.classList.add('hide'); return; }
  el.classList.remove('hide');
  const c = CHAL[G.tier];
  el.innerHTML =
    chipHTML(G.elapsed <= c.sec * 1000, `ภายใน ${fmt(c.sec * 1000)}`) +
    chipHTML(G.mistakes <= c.miss, `ผิดไม่เกิน ${c.miss}`) +
    chipHTML(G.hints === 0, 'ไม่ใช้ตัวช่วย');
}

/* ==================================================================
   17. ลงเลข / ย้อน / ทำซ้ำ
   ================================================================== */
function snapshot(){
  return {b: Array.from(G.board), n: Array.from(G.notes), sel: G.sel};
}
function pushUndo(){
  G.undoStack.push(snapshot());
  if(G.undoStack.length > 300) G.undoStack.shift();
  G.redoStack.length = 0;
}
function restore(s){
  for(let i = 0; i < 81; i++){ G.board[i] = s.b[i]; G.notes[i] = s.n[i]; }
  G.sel = s.sel;
}
function blink(i){
  cells[i].classList.add('flash');
  setTimeout(() => cells[i] && cells[i].classList.remove('flash'), 320);
}
function countPlaced(d){
  let c = 0;
  for(let i = 0; i < 81; i++) if(G.board[i] === d) c++;
  return c;
}
function setNum(d){
  if(!G || G.done || !G.running) return;
  const i = G.sel;
  if(i < 0 || G.puzzle[i]) return;
  /* เลขนี้ลงครบ 9 ตัวแล้ว ห้ามลงเพิ่ม กันกดพลาด
     (ยังกดซ้ำช่องเดิมเพื่อลบออกได้) */
  if(countPlaced(d) >= 9 && G.board[i] !== d) return;
  if(G.noteMode){
    if(G.board[i]) return;
    pushUndo(); G.notes[i] ^= BIT[d]; sfx.note();
  }else{
    if(G.board[i] === d){ pushUndo(); G.board[i] = 0; sfx.erase(); render(); stashWip(); return; }
    pushUndo();
    G.board[i] = d; G.notes[i] = 0;
    if(d !== G.solution[i]){
      G.mistakes++; sfx.wrong(); buzz(40);
      if(save.strict && G.mistakes >= strictCap(G.tier)){ render(); return loseGame(); }
    }else{
      sfx.place();
      for(const p of PEERS[i]) G.notes[p] &= ~BIT[d];
    }
    /* ลงครบ 9 ตัวแล้ว เลขนี้เป็นตัวเลือกที่ไหนไม่ได้อีก ล้างโน้ตทิ้งทั้งกระดาน
       (ไม่งั้นโน้ตจะค้างและลบผ่านแป้นไม่ได้ เพราะปุ่มถูกล็อกไปแล้ว) */
    if(countPlaced(d) >= 9) for(let k = 0; k < 81; k++) G.notes[k] &= ~BIT[d];
    blink(i);
  }
  render(); stashWip(); checkWin();
}
function erase(){
  if(!G || G.done) return;
  const i = G.sel;
  if(i < 0 || G.puzzle[i]) return;
  if(!G.board[i] && !G.notes[i]) return;
  pushUndo(); G.board[i] = 0; G.notes[i] = 0;
  sfx.erase(); render(); stashWip();
}
function undo(){
  if(!G || G.done || !G.undoStack.length) return;
  G.redoStack.push(snapshot());
  restore(G.undoStack.pop());
  render(); stashWip();
}
function redo(){
  if(!G || G.done || !G.redoStack.length) return;
  G.undoStack.push(snapshot());
  restore(G.redoStack.pop());
  render(); stashWip();
}
/* เติมตัวเลือกที่เป็นไปได้ให้ทุกช่องว่างในครั้งเดียว */
const FILL_MIN_TIER = 3;      /* เปิดใช้ตั้งแต่ระดับ ยาก ขึ้นไป */
function autoNotes(){
  if(!G || G.done || !G.running || G.tier < FILL_MIN_TIER) return;
  pushUndo();
  const cand = buildCands(G.board);
  for(let i = 0; i < 81; i++) if(!G.board[i]) G.notes[i] = cand[i];
  sfx.note(); render(); stashWip();
}

/* ==================================================================
   18. ตัวช่วย — เปิดคำตอบให้หนึ่งช่อง
      ถ้าเลือกช่องไว้จะเปิดช่องนั้น ถ้าไม่ได้เลือกหรือช่องนั้นถูกแล้ว
      จะสุ่มช่องที่ยังไม่ถูกมาเปิดให้แทน
   ================================================================== */
function hint(){
  if(!G || G.done || !G.running) return;
  if(save.items <= 0) return;              /* ไม่มีไอเทม กดไม่ได้ */
  let i = G.sel;
  if(i < 0 || G.puzzle[i] || G.board[i] === G.solution[i]){
    const open = [];
    for(let k = 0; k < 81; k++) if(G.board[k] !== G.solution[k]) open.push(k);
    if(!open.length) return;
    i = open[(Math.random() * open.length) | 0];
  }
  pushUndo();
  G.board[i] = G.solution[i];
  G.notes[i] = 0;
  for(const p of PEERS[i]) G.notes[p] &= ~BIT[G.board[i]];
  G.sel = i; G.hints++; save.hintsTotal++; save.items--;
  sfx.hint(); blink(i); storage.put();
  render(); stashWip(); checkWin();
}

/* ==================================================================
   19. จบเกม
   ================================================================== */
function markDay(){
  const k = dayKey();
  save.days = save.days || [];
  if(!save.days.includes(k)){
    save.days.push(k);
    if(save.days.length > 400) save.days = save.days.slice(-400);
  }
}
function loseGame(){
  G.done = true; G.running = false;
  keepAwake(false); sfx.lose(); buzz([60, 80, 60]);
  clearWip();
  $('loseHead').textContent = `ลงผิดเกิน ${CHAL[G.tier].miss} ครั้ง`;
  $('loseMsg').textContent = `${G.daily ? 'โจทย์ประจำวัน' : TIERS[G.tier].name + ' ข้อ ' + G.num} · ทำไปได้ ${fmt(G.elapsed)}`;
  setTimeout(() => veil('vLose', true), 300);
}
function checkWin(){
  for(let i = 0; i < 81; i++) if(G.board[i] !== G.solution[i]) return;
  G.done = true; G.running = false;
  keepAwake(false); sfx.win(); buzz([40, 70, 40]);
  clearWip();

  const openedBefore = topOpen();
  const ms = G.elapsed;
  let isBest = false, prev = null;
  const stamp = Math.max(1, Math.round(ms));       /* 0 จะกลายเป็นค่าเท็จ กันไว้ */
  if(G.daily){
    prev = save.daily[G.daily];
    isBest = prev === undefined || stamp < prev;
    if(isBest) save.daily[G.daily] = stamp;
  }else{
    const key = bestKey(G.tier, G.num);
    prev = save.best[key];
    isBest = prev === undefined || stamp < prev;
    if(isBest) save.best[key] = stamp;
  }
  /* ภารกิจ — ให้เฉพาะการผ่านครั้งแรกของข้อนั้น */
  let gained = 0;
  const won = [];
  if(G.firstClear){
    const c = CHAL[G.tier];
    if(ms <= c.sec * 1000){ gained++; won.push(`ทำเสร็จภายใน ${fmt(c.sec * 1000)}`); }
    if(G.mistakes <= c.miss){ gained++; won.push(`ลงผิดไม่เกิน ${c.miss} ครั้ง`); }
    if(G.hints === 0){ gained++; won.push('ไม่ใช้ตัวช่วยเลย'); }
    if(!G.daily){
      const cnt = doneCount(G.tier);
      if(cnt % MILESTONE === 0){
        gained += MILESTONE_REWARD;
        won.push(`ครบ ${cnt} ข้อในระดับ${TIERS[G.tier].name}`);
      }
    }
    const before = save.items;
    save.items = Math.min(MAX_ITEMS, save.items + gained);
    gained = save.items - before;              /* ชนเพดานแล้วไม่บวกเกิน */
  }
  markDay();
  storage.put();
  const openedAfter = topOpen();

  $('wHead').textContent = G.hints ? 'เสร็จแล้ว' : 'เสร็จแบบไม่ใช้ตัวช่วย';
  $('wTime').textContent = fmt(ms);
  $('wStats').textContent =
    `${G.daily ? 'โจทย์ประจำวัน' : TIERS[G.tier].name + ' ข้อ ' + G.num}` +
    ` · ตัวช่วย ${G.hints} ครั้ง · ลงผิด ${G.mistakes} ครั้ง` +
    (prev && !isBest ? ` · สถิติเดิม ${fmt(prev)}` : '');

  let tag = '';
  if(openedAfter > openedBefore) tag = `เปิดระดับ ${TIERS[openedAfter].name} แล้ว`;
  else if(isBest && prev) tag = 'ทำสถิติใหม่ของข้อนี้';
  else if(!G.daily && G.tier + 1 < 5 && !isOpen(G.tier + 1)){
    const left = UNLOCK - doneCount(G.tier);
    if(left > 0) tag = `อีก ${left} ข้อ จะเปิดระดับ ${TIERS[G.tier + 1].name}`;
  }
  if(gained > 0){
    $('wRw').innerHTML = won.map(t => '◆ ' + t).join('<br>') +
      `<br><b>ได้ตัวช่วย +${gained}</b> · มีทั้งหมด ${save.items}/${MAX_ITEMS} ชิ้น`;
  }else if(G.firstClear){
    $('wRw').innerHTML = won.length
      ? won.map(t => '◆ ' + t).join('<br>') + `<br>ตัวช่วยเต็ม ${MAX_ITEMS} ชิ้นแล้ว`
      : `ไม่ได้ภารกิจข้อไหน · มีตัวช่วย ${save.items} ชิ้น`;
  }else{
    $('wRw').innerHTML = `เคยผ่านข้อนี้แล้ว ภารกิจให้รางวัลเฉพาะครั้งแรก`;
  }
  $('wRw').classList.remove('hide');
  $('wTag').textContent = tag;
  $('wTag').classList.toggle('hide', !tag);
  $('bNextP').classList.toggle('hide', !!G.daily || G.num >= PER_TIER);
  setTimeout(() => veil('vWin', true), 240);
}

/* ==================================================================
   20. นาฬิกา
   ================================================================== */
let last = performance.now(), lastSec = -1;
function tickClock(now){
  const dt = now - last; last = now;
  if(G && G.running && !G.done){
    G.elapsed += dt;
    const sec = Math.floor(G.elapsed / 1000);
    if(sec !== lastSec){ lastSec = sec; $('time').textContent = fmt(G.elapsed); updateChal(); }
  }
  requestAnimationFrame(tickClock);
}
function pauseGame(){
  if(!G || G.done) return;
  G.running = false;
  keepAwake(false); stashWip(true);
  $('pTime').textContent = fmt(G.elapsed);
  $('boardWrap').style.visibility = 'hidden';
  veil('vPause', true);
}
function resumeGame(){
  if(!G) return;
  G.running = true; keepAwake(true);
  $('boardWrap').style.visibility = '';
  veil('vPause', false);
}
function leaveGame(){
  stashWip(true);
  G = null; keepAwake(false);
  $('boardWrap').style.visibility = '';
  drawHome(); view('home');
}

/* ==================================================================
   21. ปุ่ม
   ================================================================== */
const pad = $('pad');
for(let d = 1; d <= 9; d++){
  const b = document.createElement('button');
  b.className = 'key'; b.id = 'key' + d;
  b.innerHTML = `<b>${d}</b><i>9</i>`;
  b.onclick = () => setNum(d);
  pad.appendChild(b);
}
$('tUndo').onclick = undo;
$('tRedo').onclick = redo;
$('tErase').onclick = erase;
$('tNote').onclick = () => { if(G){ G.noteMode = !G.noteMode; render(); } };
$('tFill').onclick = autoNotes;
$('tHint').onclick = hint;
$('pauseB').onclick = pauseGame;
$('bResume').onclick = resumeGame;
$('bQuit').onclick = () => { veil('vPause', false); leaveGame(); };
$('gameBack').onclick = leaveGame;
$('bRetry').onclick = () => { veil('vLose', false); const t = G.tier, n = G.num, d = G.daily; startGame(t, n, {daily: d}); };
$('bLoseOut').onclick = () => { veil('vLose', false); leaveGame(); };
$('bNextP').onclick = () => { veil('vWin', false); startGame(G.tier, Math.min(PER_TIER, G.num + 1)); };
$('bBackList').onclick = () => { veil('vWin', false); const t = G.tier, d = G.daily; G = null; if(d){ drawHome(); view('home'); } else openPick(t); };
$('pickBack').onclick = () => { drawHome(); view('home'); };
$('pgPrev').onclick = () => { page--; drawNums(); };
$('pgNext').onclick = () => { page++; drawNums(); };
$('bContinue').onclick = () => startGame(tierIdx, firstUnsolved());

$('bStats').onclick = () => { drawStats(); view('stats'); };
$('statsBack').onclick = () => { drawHome(); view('home'); };
$('bSet').onclick = () => { drawSet(); view('set'); };
$('setBack').onclick = () => { drawHome(); view('home'); };

$('bResumeCard').onclick = () => {
  const w = save.wip;
  if(!w) return;
  startGame(w.t, w.n, {daily: w.daily, restore: w});
};
$('bDailyCard').onclick = () => {
  const d = dailyInfo();
  startGame(d.tier, d.num, {daily: d.key});
};

/* ---------- ตั้งค่า ---------- */
function drawSet(){
  [['swNight','night'],['swSound','sound'],['swCheck','check'],['swStrict','strict']]
    .forEach(([id, k]) => $(id).querySelector('.sw').classList.toggle('on', !!save[k]));
}
function toggle(id, k, after){
  $(id).onclick = () => {
    save[k] = save[k] ? 0 : 1;
    drawSet(); storage.put();
    if(after) after();
  };
}
toggle('swNight', 'night', applyNight);
toggle('swSound', 'sound', () => { if(save.sound) sfx.place(); });
toggle('swCheck', 'check', () => {
  if(!save.check && save.strict){ save.strict = 0; drawSet(); }   // ปิดตรวจ = จำกัดพลาดไม่ได้
  if(G) $('lives').classList.toggle('hide', !save.strict);
  render();
});
toggle('swStrict', 'strict', () => {
  if(save.strict && !save.check){ save.check = 1; drawSet(); }     // จำกัดพลาดต้องเปิดตรวจ
  if(G) $('lives').classList.toggle('hide', !save.strict);
  render();
});
$('bWipe').onclick = async () => {
  const all = Object.keys(save.best).length;
  if(!all && !Object.keys(save.daily).length){ alert('ยังไม่มีสถิติให้ล้าง'); return; }
  if(!confirm(`ล้างสถิติทั้งหมด ${all} ข้อ?\n\nระดับที่ปลดล็อกไว้จะกลับไปเริ่มใหม่ และย้อนกลับไม่ได้`)) return;
  save.best = {}; save.daily = {}; save.days = []; save.hintsTotal = 0; save.wip = null;
  save.items = START_ITEMS;
  try{ await window.storage.delete(KEY); }catch(e){}
  try{ window.localStorage.removeItem(KEY); }catch(e){}
  await storage.put();
  drawHome(); view('home');
};

/* ---------- คีย์บอร์ด ---------- */
window.addEventListener('keydown', e => {
  if(!G || views.game.classList.contains('hide')) return;
  if(e.key >= '1' && e.key <= '9'){ setNum(+e.key); e.preventDefault(); return; }
  if(e.key === 'Backspace' || e.key === 'Delete' || e.key === '0'){ erase(); e.preventDefault(); return; }
  if(e.key === 'n' || e.key === 'N'){ G.noteMode = !G.noteMode; render(); return; }
  if(e.key === 'f' || e.key === 'F'){ autoNotes(); return; }
  if(e.key === 'h' || e.key === 'H'){ hint(); return; }
  if(e.key === 'Escape'){ G.running ? pauseGame() : resumeGame(); return; }
  if((e.ctrlKey || e.metaKey) && e.key === 'z'){ e.shiftKey ? redo() : undo(); e.preventDefault(); return; }
  if((e.ctrlKey || e.metaKey) && e.key === 'y'){ redo(); e.preventDefault(); return; }
  const step = {ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1}[e.key];
  if(step !== undefined){
    e.preventDefault();
    const i = G.sel < 0 ? 40 : G.sel + step;
    if(i >= 0 && i < 81){
      if(Math.abs(step) === 1 && ((i / 9) | 0) !== ((G.sel / 9) | 0)) return;
      G.sel = i; render();
    }
  }
});

/* ---------- สลับออกจากแอป ---------- */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){
    if(G && G.running && !G.done) pauseGame();
  }else if(G && G.running && !G.done) keepAwake(true);
});
window.addEventListener('pagehide', () => { if(G && G.running) pauseGame(); });

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- เริ่มทำงาน ---------- */
storage.load().then(() => {
  /* กันตัน: ข้อถูกล็อกเป็นลำดับ ถ้าไอเทมหมดแล้วติดอยู่จะไปต่อไม่ได้
     เปิดแอปวันใหม่จึงเติมให้ถึง 2 ชิ้นเสมอ */
  const today = dayKey();
  if(save.topUp !== today){
    save.topUp = today;
    if(save.items < 2) save.items = 2;
    storage.put();
  }
  applyNight();
  drawHome();
  view('home');
  requestAnimationFrame(tickClock);
});
})();
</script>
